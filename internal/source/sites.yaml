sites:
  - host: web3.career
    module: links
    skip_json_ld: true
    link_pattern: '^/[a-z0-9][a-z0-9-]*/\d{5,}$'
    content:
      - attr: class
        substr: text-dark-grey-text
  - host: web3.careers
    module: links
    skip_json_ld: true
    link_pattern: '^/[a-z0-9][a-z0-9-]*/\d{5,}$'
    content:
      - attr: class
        substr: text-dark-grey-text
  - host: remote3.co
    module: feed
    list_address: https://remote3.co/api/rss
    content:
      - attr: class
        substr: RemoteJobs_jobDescription
  - host: weworkremotely.com
    module: feed
    list_address: https://weworkremotely.com/remote-jobs.rss
  - host: cryptocurrencyjobs.co
    module: feed
    list_address: https://cryptocurrencyjobs.co/index.xml
  - host: jobs.framework.ventures
    module: getro
    list_address: https://jobs.framework.ventures/jobs
  - host: a16zfrontier.com
    module: a16z
    script_var: portfolioJobs
  - host: paradigm.xyz
    module: paradigm
